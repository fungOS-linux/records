[package]
name = "fungos-records"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fungOS-linux/records"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
feed-rs = "3"
ical_vcard = "0.5"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = "2"
uuid = { version = "1", features = ["v4"] }
unibus = { git = "https://github.com/fungOS-linux/unibus.git", rev = "8bf8f79" }

[[bin]]
name = "records"
path = "src/main.rs"
